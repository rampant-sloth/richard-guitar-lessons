hero:
  eyebrow: About Richard
  title: About Richard
  intro: >-
    Guitarist, former school teacher, and the bloke on the other end of the Zoom
    call. Here's a bit about me and how I teach.


    Richard has been playing guitar for over 25 years, and teaching for 20 years. He studied music at ICMP in London, and has experience gigging and touring in various original bands, as well as covers/function bands, plus recording and session work.


    Currently, Richard teaches numerous guitar, bass, and ukulele students, privately and for music services/schools, and has taught literally thousands of students, with many going onto session and live work, studying Music at college and University, and playing in bands.


    Richard specialises in contemporary electric styles, however is also an experienced bassist and acoustic player, as well as a ukulele player.


    Richard has helped hundreds of students through their grade exams, GCSEs, A Levels, and University and college auditions, however if you’d like to just play casually and for fun, that won’t be a problem at all. Richard has transcribed hundreds of pieces for students over the years, and can help you nail that Gilmour solo, or improve your picking techniques, or learn that Thundercat bassline, or help you get comfortable with that Coldplay strumming pattern, and/or whatever you may want to cover.
  image: /images/richgtr1-1.jpg
  imageAlt: Richard, guitar teacher
  backgroundImage: ""
  buttons: []
sections:
  - layout: list
    heading: How I teach
    body: >-
      I think lessons should be the best part of your week - not a chore you
      dread. You learn fastest when you're playing music you love, at a pace
      that feels right, with a teacher who actually listens. So that's what I
      do.


      Learning an instrument and music theory is difficult - I'll never pretend otherwise. But a good teacher helps you find the shortcuts, and that's my whole job. Not prescriptive, not school-style; just personable, honest and focused on getting you playing.
    items:
      - icon: 🤝
        title: Patient & encouraging
        text: no judgement, ever.
      - icon: 🎯
        title: Goal-driven
        text: clear direction in every lesson.
      - icon: 📈
        title: Progress you can feel
        text: from the very first lesson.
    background: dark
  - layout: cards
    background: gray
    heading: My setup (so you can actually hear me)
    intro: "Online lessons only work if you can actually hear and see what's going
      on. So I've put proper kit into it:"
    items:
      - icon: 🎙️
        title: Studio-quality audio
        text: Professional microphone and interface, so every note rings clear.
      - icon: 🎥
        title: HD video
        text: Clear camera angles on both hands.
      - icon: 💡
        title: Pro lighting
        text: A bright, distraction-free view of the fretboard.
      - icon: 🖥️
        title: Tabs in Advance
        text: I'll make sure you have tab and chord diagrams well in advance so you can
          print or have them on a second screen during our lessons.
