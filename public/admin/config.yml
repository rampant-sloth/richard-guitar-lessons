backend:
  name: github
  repo: rampant-sloth/richard-guitar-lessons
  branch: main
  base_url: https://decap-oauth.rampantsloth-3b0.workers.dev
  auth_endpoint: auth

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: news
    label: News
    label_singular: News post
    folder: src/content/news
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
      - { label: Body, name: body, widget: markdown }
      - { label: YouTube Video ID, name: youtubeId, widget: string, required: false, hint: "Optional. Just the ID part of a YouTube URL, e.g. yEIYaVfM92A" }

  - name: lessons
    label: Lesson types
    label_singular: Lesson type
    folder: src/content/lessons
    create: true
    extension: yml
    format: yaml
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Instrument, name: instrument, widget: select, options: [Guitar, Bass, Ukulele] }
      - { label: Audience, name: audience, widget: select, options: [Kids, Adults, Everyone] }
      - { label: Duration (minutes), name: durationMinutes, widget: number, value_type: int, min: 15, step: 15, default: 30 }
      - { label: Price (£), name: price, widget: number, value_type: float, min: 0 }
      - { label: Summary, name: summary, widget: text }
      - { label: cal.com event link, name: calLink, widget: string, required: false, hint: "Optional. Leave blank until Richard's own cal.com account exists." }
      - { label: Order, name: order, widget: number, value_type: int, default: 0, required: false }

  - name: theme
    label: Theme
    files:
      - name: theme
        label: Colours & fonts
        file: src/content/theme/theme.yml
        fields:
          - { label: Colour scheme, name: colourScheme, widget: select, options: [{ label: Emerald (default), value: emerald }, { label: Teal, value: teal }, { label: Blue, value: blue }, { label: Indigo, value: indigo }, { label: Violet, value: violet }, { label: Rose, value: rose }, { label: Amber, value: amber }, { label: Slate (mono), value: slate }], hint: "Changes the accent colour used for buttons, links and highlights across the whole site." }
          - { label: Heading font, name: fontHeading, widget: select, options: [{ label: System default, value: system }, { label: Inter, value: inter }, { label: Poppins, value: poppins }, { label: Nunito, value: nunito }, { label: Lora (serif), value: lora }, { label: Merriweather (serif), value: merriweather }] }
          - { label: Body font, name: fontBody, widget: select, options: [{ label: System default, value: system }, { label: Inter, value: inter }, { label: Poppins, value: poppins }, { label: Nunito, value: nunito }, { label: Lora (serif), value: lora }, { label: Merriweather (serif), value: merriweather }] }

  - name: settings
    label: Site settings
    files:
      - name: settings
        label: General
        file: src/content/site/settings.yml
        fields:
          - { label: Site title, name: siteTitle, widget: string }
          - { label: Tagline, name: tagline, widget: text }
          - { label: Contact email, name: contactEmail, widget: string }
          - { label: Streaming platforms, name: platforms, widget: string }
          - { label: Homepage hero title, name: heroTitle, widget: string }
          - { label: Homepage hero intro, name: heroIntro, widget: text }
          - { label: Homepage hero image, name: heroImage, widget: image, required: false, hint: "Optional — a photo of you playing, shown beside the intro on the homepage." }
          - { label: About page photo, name: aboutImage, widget: image, required: false, hint: "Optional — shown beside the intro on the About page." }
